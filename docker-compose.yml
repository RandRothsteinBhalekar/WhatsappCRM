name: wacrm

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wacrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wacrm}
      POSTGRES_DB: ${POSTGRES_DB:-wacrm}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - wacrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    env_file:
      - .env.local
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://wacrm:wacrm@db:5432/wacrm}
      MEDIA_ROOT: /data/media
    volumes:
      - wacrm_media:/data/media
    ports:
      - '${HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wacrm_pgdata:
  wacrm_media:
